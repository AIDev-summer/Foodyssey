<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>푸디세이로 이동 중</title>
<meta name="robots" content="noindex,nofollow">
<link rel="canonical" href="https://foodyssey.co.kr/">
<!-- 인스타 프로필 링크용 짧은 주소(/ig). 이동 전용 페이지라 구조화 데이터·광고·통계 스크립트는 넣지 않아요. -->
<!-- 자바스크립트가 켜져 있으면 아래 스크립트가 ?me=0/1 값을 이어 붙여 이동하고, 꺼져 있으면 noscript의 meta refresh가 이동해요. -->
<noscript><meta http-equiv="refresh" content="0;url=https://foodyssey.co.kr/?utm_source=instagram&amp;utm_medium=social&amp;utm_campaign=profile"></noscript>
<script>
(function () {
  var to = '/?utm_source=instagram&utm_medium=social&utm_campaign=profile';
  var m = /[?&]me=(0|1)(&|$)/.exec(location.search);
  if (m) to += '&me=' + m[1];
  location.replace(to);
})();
</script>
<style>
body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 15px/1.7 "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: #15191a; background: #f6faf7; text-align: center; }
a { color: #1a7a5c; font-weight: 600; }
p { margin: 0; padding: 24px; }
@media (prefers-color-scheme: dark) { body { color: #e6ece9; background: #121816; } a { color: #52c49d; } }
</style>
</head>
<body>
<p>푸디세이로 이동하고 있어요. 자동으로 이동하지 않으면 <a href="https://foodyssey.co.kr/?utm_source=instagram&amp;utm_medium=social&amp;utm_campaign=profile">여기를 눌러 주세요</a>.</p>
</body>
</html>
