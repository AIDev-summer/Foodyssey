name: 매일 메뉴 PR 자동 병합

# 클라우드 Routine(매일 09시 KST)이 만든 auto/daily-* PR을 검사해서 모두 통과하면 병합해요.
# 검사: ① PR이 data.js(와 조사 기록 data/daily-log/날짜.md)만 바꿨는지 ② data.js 구조·로드 ③ 새 출처 기사에 값이 있는지(verify-sources) ④ 전체 빌드(린트·가치 게이트·링크).
# 하나라도 실패하면 병합하지 않고 PR에 실패 사유를 댓글로 남겨요(워크플로 자체는 성공으로 끝나서 실패 메일이 가지 않아요).
# 병합 뒤에는 '메뉴 페이지 만들기' 워크플로를 직접 실행해요(GITHUB_TOKEN 병합은 push 이벤트를 만들지 않아서).
# test 브랜치(auto/test-*)에 push하면 병합 없이 검사만 해요(리허설).

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  schedule:
    - cron: '25 0-5 * * *'
  push:
    branches: ['auto/test-*']
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: auto-merge-daily
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'auto/daily-')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 병합 후보 PR 고르기
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "dry=true" >> "$GITHUB_OUTPUT"
            echo "list=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "dry=false" >> "$GITHUB_OUTPUT"
            gh pr list --state open --base main --json number,headRefName --jq '[.[] | select(.headRefName | startswith("auto/daily-"))] | sort_by(.number) | .[].number' | tr '\n' ' ' > /tmp/prs.txt
            echo "list=$(cat /tmp/prs.txt)" >> "$GITHUB_OUTPUT"
          fi
      - name: 검사하고 병합
        env:
          GH_TOKEN: ${{ github.token }}
          LIST: ${{ steps.pick.outputs.list }}
          DRY: ${{ steps.pick.outputs.dry }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          merged=0; failed=0
          if [ -z "$(echo $LIST | tr -d ' ')" ]; then echo "병합할 auto/daily PR 없음"; exit 0; fi
          for ITEM in $LIST; do
            git checkout -q -f main && git reset -q --hard origin/main && git clean -fdq
            reason=""
            if [ "$DRY" = "true" ]; then
              git fetch -q origin "$ITEM" && git merge -q --no-commit --no-ff "origin/$ITEM" || reason="브랜치를 main에 합치지 못했어요(충돌)"
              label="리허설 $ITEM"
            else
              git fetch -q origin "pull/$ITEM/head:pr-$ITEM" && git merge -q --no-commit --no-ff "pr-$ITEM" || reason="main과 충돌해요(사람이 확인 필요)"
              label="PR #$ITEM"
            fi
            if [ -z "$reason" ]; then
              changed=$(git diff --cached --name-only | grep -Ev '^(data\.js|data/daily-log/[0-9]{4}-[0-9]{2}-[0-9]{2}\.md)$' | tr '\n' ' ')
              [ -n "$changed" ] && reason="data.js 말고 다른 파일도 바뀌었어요: $changed"
            fi
            if [ -z "$reason" ]; then node scripts/check-data.js >/tmp/c1.log 2>&1 || reason="data.js 점검 실패: $(tail -4 /tmp/c1.log | tr '\n' ' ')"; fi
            if [ -z "$reason" ]; then node scripts/verify-sources.js --changed origin/main --out /tmp/sc.json >/tmp/c2.log 2>&1 || reason="출처 대조 불일치: $(grep ' - ' /tmp/c2.log | head -4 | tr '\n' ' ')"; fi
            if [ -z "$reason" ]; then node scripts/build.js >/tmp/c3.log 2>&1 || reason="빌드·린트·가치 게이트 실패: $(grep -E ' - |실패' /tmp/c3.log | head -4 | tr '\n' ' ')"; fi
            git merge --abort 2>/dev/null || true
            git checkout -q -f main && git reset -q --hard origin/main && git clean -fdq
            if [ -n "$reason" ]; then
              echo "::warning title=자동 병합 보류 ($label)::$reason"
              if [ "$DRY" != "true" ]; then gh pr comment "$ITEM" --body "자동 병합을 보류했어요. 사유: $reason (이 PR은 열어 두었어요. PULSE·관리자 확인 필요)"; fi
              failed=$((failed+1)); break
            fi
            if [ "$DRY" = "true" ]; then echo "리허설 통과: $ITEM"; continue; fi
            # 클라우드 Routine이 PR을 초안(draft)으로 만들어서, 검사 통과 뒤 병합 전에 초안을 해제해요.
            gh pr ready "$ITEM" 2>/dev/null || true
            if gh pr merge "$ITEM" --merge --body "자동 병합: data.js 점검·출처 대조·빌드 모두 통과" 2>/tmp/m.log; then merged=$((merged+1)); else
              err=$(tr '\n' ' ' < /tmp/m.log | cut -c1-300)
              echo "::warning title=병합 실패 (PR #$ITEM)::$err"
              gh pr comment "$ITEM" --body "검사는 통과했지만 병합에 실패했어요. 사유: $err (이 PR은 열어 두었어요. PULSE·관리자 확인 필요)" || true
              failed=$((failed+1)); break
            fi
            git fetch -q origin main
          done
          echo "병합 $merged건, 보류 $failed건"
          if [ "$merged" -gt 0 ]; then gh workflow run build-pages.yml || echo "::warning::페이지 만들기 실행 요청 실패(다음 푸시나 00:10 실행 때 반영돼요)"; fi
