# data.js가 main에 합쳐질 때와 매일 0시 10분(한국 시간)에 메뉴·브랜드·업종 페이지와 sitemap.xml을 다시 만들어요.
# 바뀐 게 있으면 main에 커밋하고 GitHub Pages 빌드를 요청해요. (0시 실행은 끝난 한정 메뉴를 "판매 종료"로 바꾸려고 돌아요.)
name: 메뉴 페이지 만들기

on:
  push:
    branches: [main]
    paths: ['data.js', 'scripts/**', 'index.html']
  schedule:
    - cron: '10 15 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JSON-LD 린트 자체 테스트
        run: node scripts/test-lint-jsonld.js
      - name: 페이지 만들기(끝에 JSON-LD 린트가 돌고, 진짜 오류면 산출물을 올리지 않아요)
        id: build
        continue-on-error: true
        run: node scripts/build.js
      - name: 빌드 오류 알림(메일 대신 로그에 오류로 표시, PULSE 주기 점검이 라이브 날짜 정체로 확인)
        if: steps.build.outcome == 'failure'
        run: echo "::error title=푸디세이 빌드 실패::린트·링크·JSON-LD 같은 진짜 오류로 이번 산출물은 올리지 않았어요. 위 '페이지 만들기' 로그를 확인하세요."
      - name: 바뀐 파일 커밋
        id: commit
        if: steps.build.outcome == 'success'
        run: |
          git config core.quotepath false
          if [ -z "$(git status --porcelain)" ]; then echo "바뀐 페이지 없음"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A menu brand cat season new guide data updates.html sitemap.xml rss.xml index.html
          git commit -m "메뉴 페이지 자동 생성 ($(TZ=Asia/Seoul date +%F))"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: GitHub Pages 빌드 요청
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages 빌드 요청 실패(다음 푸시 때 반영돼요)"
