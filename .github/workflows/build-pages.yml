# data.js가 main에 합쳐질 때와 매일 0시 10분(한국 시간)에 메뉴·브랜드·업종 페이지와 sitemap.xml을 다시 만들어요.
# 바뀐 게 있으면 main에 커밋하고 GitHub Pages 빌드를 요청해요. (0시 실행은 끝난 한정 메뉴를 "판매 종료"로 바꾸려고 돌아요.)
name: 메뉴 페이지 만들기

on:
  push:
    branches: [main]
    paths: ['data.js', 'scripts/**', 'index.html']
  schedule:
    - cron: '10 15 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.js
      - name: 바뀐 파일 커밋
        id: commit
        run: |
          git config core.quotepath false
          if [ -z "$(git status --porcelain)" ]; then echo "바뀐 페이지 없음"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A menu brand cat data sitemap.xml rss.xml index.html
          git commit -m "메뉴 페이지 자동 생성 ($(TZ=Asia/Seoul date +%F))"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: GitHub Pages 빌드 요청
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages 빌드 요청 실패(다음 푸시 때 반영돼요)"
